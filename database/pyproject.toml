[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "bc_fsf_database"
dependencies = [
    "SQLAlchemy",
    "Flask-SQLAlchemy",
    "PyMySQL",
    "Flask-Migrate",
    "SQLAlchemy-Utils",
]
requires-python = ">= 3.8"
description = "Use a database/sqlalchemy with a site"
readme = "README.md"
