[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "bc_fsf_base"
dependencies = [
    "flask",
    "flask-bootstrap",
    "flask-mail",
    "arrow",
    "python-dotenv",
    "purl",
    "markdown",
    "altcha",
]
requires-python = ">= 3.8"
description = "Base plugins & app factory"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bc_fsf_base = ["*.j2"]